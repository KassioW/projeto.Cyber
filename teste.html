<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoramento</title>
    <style>
        /* Fundo escuro texturizado para combinar com a paleta do dashboard */
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #121212; 
            background-image: radial-gradient(circle at center, #2b2b2b 0%, #121212 100%);
            margin: 0; 
        }
        
        /* A mesma caixa translúcida do dashboard, mas com um sutil sombreamento azul */
        .login-box { 
            background: rgba(27, 25, 25, 0.9); 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(3, 169, 244, 0.15); 
            width: 90%; 
            max-width: 320px;
            box-sizing: border-box;
            text-align: center; 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 { 
            margin-top: 0; 
            color: #9e9d9d; 
            font-weight: normal;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Inputs escuros com bordas que acendem em azul ao focar */
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0 20px 0; 
            background: #1a1a1a;
            color: #9e9d9d;
            border: 1px solid #333; 
            border-radius: 6px; 
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #03a9f4;
            box-shadow: 0 0 8px rgba(3, 169, 244, 0.3);
        }

        /* Botão com efeito de brilho no hover */
        button { 
            width: 100%; 
            padding: 12px; 
            background: #03a9f4; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1em;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s; 
        }
        button:hover { 
            background: #0288d1; 
            box-shadow: 0 0 15px rgba(3, 169, 244, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }

        #erro { 
            color: #ff5252; 
            font-size: 0.9em; 
            display: none; 
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Acesso Restrito</h2>
    <input type="text" id="usuario" placeholder="Usuário" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button onclick="realizarLogin()">Entrar</button>
    <p id="erro">Credenciais inválidas!</p>
</div>

<script>
    // gerar hash (Mitigação OWASP A07)
    async function gerarHash(texto) {
        const buffer = new TextEncoder().encode(texto);
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function realizarLogin() {
        const usuario = document.getElementById('usuario').value;
        const senha = document.getElementById('senha').value;
        const erroBox = document.getElementById('erro');
        
        const senhaHash = await gerarHash(senha);
        const hashEsperado = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'; // hash de admin

        if (usuario === 'admin' && senhaHash === hashEsperado) {
            sessionStorage.setItem('auth_token', 'token_seguro_simulado');
            window.location.href = 'dashboard.html';
        } else {
            erroBox.style.display = 'block';
        }
    }
</script>

</body>
</html>
