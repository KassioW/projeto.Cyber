<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações de Conexão</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        
        #mapa-fundo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            border: none;
        }

        .card { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
            width: 90%; /* Ajuste principal para mobile */
            max-width: 400px;
            box-sizing: border-box; /* Evita que o padding quebre a largura no celular */
            backdrop-filter: blur(5px);
        }
        
        h2 { margin-top: 0; color: #333; text-align: center; }
        p { font-size: 1.1em; color: #444; line-height: 1.6; }
        .dado { font-weight: bold; color: #03a9f4; }
    </style>
</head>
<body>

<iframe id="mapa-fundo" src=""></iframe>

<div class="card">
    <h2>Olá</h2>
    <p>Seu ip é: <br><span id="ip" class="dado">Buscando...</span></p>
    <p>Você atualmente está localizado em: <br><span id="local" class="dado">Buscando...</span></p>
    <p>Seu provedor de internet é: <br><span id="provedor" class="dado">Buscando...</span></p>
</div>

<script>
    // Passo 1: Busca estritamente o IPv4
    fetch('https://api.ipify.org?format=json')
        .then(respostaIpv4 => respostaIpv4.json())
        .then(dadosIpv4 => {
            const ipApenasV4 = dadosIpv4.ip;
            document.getElementById('ip').textContent = ipApenasV4;

            // Passo 2: Pede a localização baseada nesse IPv4
            return fetch(`https://ipapi.co/${ipApenasV4}/json/`);
        })
        .then(respostaLocal => respostaLocal.json())
        .then(dados => {
            document.getElementById('local').textContent = `${dados.city}, ${dados.region}`;
            document.getElementById('provedor').textContent = dados.org;

            const lat = dados.latitude;
            const lon = dados.longitude;
            const urlGoogleMaps = `https://maps.google.com/maps?q=${lat},${lon}&z=13&output=embed`;
            document.getElementById('mapa-fundo').src = urlGoogleMaps;
        })
        .catch(erro => {
            document.getElementById('ip').textContent = "Indisponível";
            document.getElementById('local').textContent = "Indisponível";
            document.getElementById('provedor').textContent = "Indisponível";
            console.error("Erro ao buscar dados:", erro);
        });
</script>

</body>
</html>
