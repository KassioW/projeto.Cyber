<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoramento</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ffffff; }
        .login-box { background: #eee8e8; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #03a9f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0288d1; }
        #erro { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Acesso Restrito</h2>
    <input type="text" id="usuario" placeholder="Usuário" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button onclick="realizarLogin()">Entrar</button>
    <p id="erro">Credenciais inválidas!</p>
</div>

<script>
    // gerar hash (Mitigação OWASP A07)
    async function gerarHash(texto) {
        const buffer = new TextEncoder().encode(texto);
        const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function realizarLogin() {
        const usuario = document.getElementById('usuario').value;
        const senha = document.getElementById('senha').value;
        const erroBox = document.getElementById('erro');
        
        const senhaHash = await gerarHash(senha);
        const hashEsperado = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9'; // hash de admin

        if (usuario === 'admin' && senhaHash === hashEsperado) {
            sessionStorage.setItem('auth_token', 'token_seguro_simulado');
            window.location.href = 'dashboard.html';
        } else {
            erroBox.style.display = 'block';
        }
    }
</script>

</body>
</html>
